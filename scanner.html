<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Сканер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { color-scheme: light dark; --bg:#ffffff; --fg:#1a1a1a; --accent:#6B1020; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --fg:#f2f2f2; } }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--bg); color:var(--fg); }
  header { background:var(--accent); color:#fff; padding:14px 16px; font-size:18px; font-weight:700; }
  #reader { width:100%; max-width:480px; margin:12px auto; }
  p { margin:8px 16px; font-size:16px; }
  #msg { color:#c62828; min-height:22px; }
  .manual { display:flex; gap:8px; margin:12px 16px; }
  input { flex:1; font-size:18px; padding:10px; border:1px solid #888; border-radius:8px; background:transparent; color:inherit; }
  button { font-size:18px; padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; }
</style>
</head>
<body>
<header>Наведите камеру на штрихкод коробки или QR поддона</header>
<div id="reader"></div>
<p id="msg"></p>
<div class="manual">
  <input id="code" inputmode="numeric" placeholder="или введите код вручную">
  <button id="send">ОК</button>
</div>
<script>
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  let done = false;
  function deliver(text) {
    if (done || !text) return;
    done = true;
    if (tg) { tg.sendData(String(text).trim()); }   // бот получит текст, окно закроется
    else { document.getElementById("msg").textContent = "Код: " + text + " (откройте страницу из Telegram)"; }
  }
  document.getElementById("send").onclick = () => deliver(document.getElementById("code").value);
  const formats = [Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.QR_CODE,
                   Html5QrcodeSupportedFormats.CODE_128];
  const scanner = new Html5Qrcode("reader", { formatsToSupport: formats, useBarCodeDetectorIfSupported: true });
  scanner.start({ facingMode: "environment" }, { fps: 12, qrbox: { width: 280, height: 160 } },
    (text) => { scanner.stop().catch(() => {}); deliver(text); }, () => {})
    .catch(() => { document.getElementById("msg").textContent =
      "Нет доступа к камере. Разрешите камеру для Telegram или введите код вручную."; });
</script>
</body>
</html>
